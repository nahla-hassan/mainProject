<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Divisions - Teacher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            padding-top: 150px;
        }

        /* Navbar styles */
        .admin-navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 999;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: white !important;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .navbar-nav .nav-link {
            color: rgba(255,255,255,0.9) !important;
            margin: 0 8px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            background: white;
            color: var(--primary-color);
        }

        /* Form container */
        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            max-width: 800px;
            margin: auto;
        }
        
        h2 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Custom Checkbox Styles - Pure CSS */
        .checkbox-group {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        /* Django renders checkboxes in <ul><li> structure */
        .checkbox-group ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checkbox-group li {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        /* Hover effect - pure CSS */
        .checkbox-group li:hover {
            border-color: var(--primary-color);
            background: #f8f9ff;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        /* Large, visible checkboxes */
        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .checkbox-group label {
            cursor: pointer;
            margin: 0;
            font-size: 15px;
            color: #333;
            font-weight: 500;
            flex: 1;
            user-select: none;
        }

        /* Checked state styling - pure CSS using :has() */
        .checkbox-group li:has(input[type="checkbox"]:checked) {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            border-color: var(--primary-color);
            border-width: 2px;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .checkbox-group li:has(input[type="checkbox"]:checked) label {
            color: var(--primary-color);
            font-weight: 700;
        }

        /* Focus state for accessibility */
        .checkbox-group input[type="checkbox"]:focus {
            outline: 3px solid rgba(102, 126, 234, 0.3);
            outline-offset: 2px;
        }

        /* Custom scrollbar - pure CSS */
        .checkbox-group::-webkit-scrollbar {
            width: 10px;
        }

        .checkbox-group::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .checkbox-group::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 10px;
        }

        .checkbox-group::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        .form-label {
            font-weight: 600;
            color: #444;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            margin-left: 10px;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
        }

        /* Section icons */
        .section-icon {
            color: var(--primary-color);
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
                margin: 15px;
            }
            
            .checkbox-group {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg admin-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            ClassCrest
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background: white;">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fas fa-home me-1"></i> Admin Home
                    </a>
                </li>
                <li class="nav-item ms-3">
                    <a href="{% url 'logout' %}" class="btn btn-logout">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Form -->
<div class="form-container">
    <h2><i class="fas fa-user-tie section-icon"></i>Assign Divisions and Subjects to Teacher</h2>

    <form method="post">
        {% csrf_token %}
        <!-- Subjects Section -->
        <div class="mb-4">
            <label class="form-label">
                <i class="fas fa-book section-icon"></i>Select Subjects
            </label>
            <div class="checkbox-group">
                <ul>
                    {% for checkbox in form.subjects %}
                    <li>
                        {{ checkbox.tag }}
                        <label for="{{ checkbox.id_for_label }}">{{ checkbox.choice_label }}</label>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>


        <!-- Divisions Section -->
        <div class="mb-4">
            <label class="form-label">
                <i class="fas fa-users section-icon"></i>Assigned Divisions
            </label>
            <div class="checkbox-group">
                <ul>
                    {% for checkbox in form.assigned_divisions %}
                    <li>
                        {{ checkbox.tag }}
                        <label for="{{ checkbox.id_for_label }}">{{ checkbox.choice_label }}</label>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>


        <div class="mt-4">
            <button type="submit" class="btn btn-save">
                <i class="fas fa-save me-2"></i>Save Assignment
            </button>
            <a href="{% url 'assign_divisions' teacher.id %}" class="btn btn-secondary btn-back">
                <i class="fas fa-arrow-left me-2"></i>Back
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
