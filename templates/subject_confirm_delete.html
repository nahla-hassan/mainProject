<!DOCTYPE html>
<html>
<head>
    <title>Delete Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Delete Subject</h2>
    <p>Are you sure you want to delete <strong>{{ subject.name }}</strong> for class {{ subject.get_class_name_display }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'subject-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
