<!DOCTYPE html>
<html>
<head>
    <title>Subjects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table thead {
            background-color: #0d6efd;
            color: white;
        }
        .btn-space {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Subjects</h2>
            <a href="{% url 'subject-add' %}" class="btn btn-primary">Add Subject</a>
        </div>

        <!-- Class Filter -->
        <form method="get" class="mb-3">
            <label for="class_filter" class="form-label">Filter by Class:</label>
            <select id="class_filter" name="class_name" class="form-select w-auto d-inline-block" onchange="this.form.submit()">
                <option value="">All Classes</option>
                {% for i in class_choices %}
                    <option value="{{ i }}" {% if class_filter == i %}selected{% endif %}>Class {{ i }}</option>
                {% endfor %}
            </select>
        </form>

        <!-- Subjects Table -->
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Subject Name</th>
                        <th>Class</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for subject in subjects %}
                    <tr>
                        <td>{{ subject.name }}</td>
                        <td>{{ subject.get_class_name_display }}</td>
                        <td class="text-center">
                            <a href="{% url 'subject-edit' subject.id %}" class="btn btn-sm btn-warning btn-space">Edit</a>
                            <a href="{% url 'subject-delete' subject.id %}" class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">No subjects found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
