<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Student Timetable</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-card {
            width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            animation: fadeIn 0.7s ease;
        }

        .upload-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .btn-upload {
            background: var(--primary-color);
            border: none;
            transition: 0.3s;
            font-size: 1rem;
            padding: 10px;
            border-radius: 10px;
        }

        .btn-upload:hover {
            background: var(--secondary-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="upload-card">

    <h3 class="upload-title">Upload Timetable</h3>

    {% if messages %}
        {% for msg in messages %}
            <div class="alert alert-success">{{ msg }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label class="form-label fw-semibold">Choose CSV File</label>
        <input type="file" name="csv_file" class="form-control mb-3" required>

        <button type="submit" class="btn btn-upload text-white w-100">Upload</button>
    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
