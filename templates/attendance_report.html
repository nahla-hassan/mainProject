<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Report - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.1);
            --btn-hover: #5a67d8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 950px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        /* Form Styling */
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px 25px;
            margin-bottom: 30px;
            align-items: flex-end;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        form label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        form select, form input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        form button {
            grid-column: span 2;
            justify-self: start;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        form button:hover {
            background-color: var(--btn-hover);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            box-shadow: 0 4px 12px var(--card-shadow);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        th {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        .no-data {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 1rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            background-color: var(--secondary-color);
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background-color: var(--primary-color);
        }

        /* Responsive Fix */
        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            form button {
                grid-column: span 1;
                width: 100%;
            }
        }

    </style>
</head>
<body>
<div class="container">
    <h2>Attendance Report</h2>

    <form method="get">
        <div>
            <label>Select Class:</label>
            <select name="class">
                <option value="">All Classes</option>
                {% for c in classes %}
                    <option value="{{ c }}" {% if selected_class == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Select Division:</label>
            <select name="division">
                <option value="">All Divisions</option>
                {% for d in divisions %}
                    <option value="{{ d }}" {% if selected_division == d %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Start Date:</label>
            <input type="date" name="start_date" value="{{ start_date }}">
        </div>

        <div>
            <label>End Date:</label>
            <input type="date" name="end_date" value="{{ end_date }}">
        </div>

        <button type="submit">Filter</button>
    </form>

    {% if attendance_summary %}
        <table border="1">
            <thead>
                <tr>
                    <th>Class</th>
                    <th>Total Students</th>
                    <th>Present (%)</th>
                    <th>Absent (%)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in attendance_summary %}
                    <tr>
                        <td>{{ item.class_name }}</td>
                        <td>{{ item.total_students }}</td>
                        <td>{{ item.present_percent }}%</td>
                        <td>{{ item.absent_percent }}%</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="no-data">No attendance data found.</div>
    {% endif %}

    <a href="{% url 'admin_dashboard' %}" class="btn-back">
        <i class="fas fa-arrow-left me-2"></i>Back
    </a>
</div>
</body>
</html>
