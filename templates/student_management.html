{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Navbar */
        .admin-navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: white !important;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand-logo {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .navbar-nav .nav-link {
            color: rgba(255,255,255,0.9) !important;
            margin: 0 8px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }
        
        .navbar-nav .nav-link i {
            margin-right: 6px;
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            background: white;
            color: var(--primary-color);
        }
        .dashboard-card {
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .dashboard-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: inherit;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px;
        }
        .text-primary-violet {
            color: var(--primary-color) !important;
        }
        .bg-primary-violet {
            background-color: var(--primary-color) !important;
        }
        .bg-primary-violet-light {
            background-color: rgba(102, 126, 234, 0.1) !important;
        }

        /* Navbar */
        .admin-navbar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: white !important;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand-logo {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .navbar-nav .nav-link {
            color: rgba(255,255,255,0.9) !important;
            margin: 0 8px;
            font-weight: 500;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white !important;
        }
        
        .navbar-nav .nav-link i {
            margin-right: 6px;
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            background: white;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg admin-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'admin_dashboard' %}">
                <div class="brand-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                ClassCrest
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background: white;">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'admin_dashboard' %}">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    
                    <li class="nav-item ms-5">
                        <a href="{% url 'logout' %}" class="btn btn-logout">
                            <i class="fas fa-sign-out-alt me-2 "></i>Logout
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-primary-violet">Student Management</h1>
        <div class="row justify-content-center g-4">

            <!-- Register Student -->
            <div class="col-md-5">
                <a href="{% url 'student_register' %}" class="text-decoration-none">
                    <div class="dashboard-card card h-100">
                        <div class="card-body text-center p-5">
                            <div class="icon-box bg-primary-violet-light">
                                <i class="fas fa-user-plus fa-3x text-primary-violet"></i>
                            </div>
                            <h3 class="card-title mb-3">Register Student</h3>
                            <p class="card-text text-muted">Click here to add new students to the system</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- View Students -->
            <div class="col-md-5">
                <a href="{% url 'student_view' %}" class="text-decoration-none">
                    <div class="dashboard-card card h-100">
                        <div class="card-body text-center p-5">
                            <div class="icon-box bg-success bg-opacity-10">
                                <i class="fas fa-users fa-3x text-success"></i>
                            </div>
                            <h3 class="card-title mb-3">View Students</h3>
                            <p class="card-text text-muted">View all registered students</p>
                        </div>
                    </div>
                </a>
            </div>

    </div>
</div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
