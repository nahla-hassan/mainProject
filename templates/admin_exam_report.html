<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Marks Report - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            align-items: flex-end;
        }

        form label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        form select, form input {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        form button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        form button:hover {
            background-color: var(--secondary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            box-shadow: 0 4px 10px var(--card-shadow);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        .btn-back {
            margin-top: 20px;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Exam Marks Report</h2>

    <form method="get">
        <div>
            <label>Select Class:</label>
            <select name="class_name">
                <option value="">All Classes</option>
                {% for c in classes %}
                    <option value="{{ c }}" {% if selected_class == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>


        <button type="submit">Filter</button>
    </form>

    {% if marks_summary %}
    <table border="1">
        <thead>
            <tr>
                <th>Class</th>
                <th>Total Students</th>
                <th>Average Marks</th>
            </tr>
        </thead>
        <tbody>
            {% for item in marks_summary %}
                <tr>
                    <td>{{ item.class_name }}</td>
                    <td>{{ item.total_students }}</td>
                    <td>{{ item.average_marks }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    {% else %}
        <div class="no-data">No exam marks data found.</div>
    {% endif %}

    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-back">
        <i class="fas fa-arrow-left me-2"></i>Back
    </a>
</div>
</body>
</html>
